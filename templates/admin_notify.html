{% extends 'base.html' %}
{% block title %}Send Notification - Admin{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4">Send Notification</h2>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Send To</label>
                        <select name="user_id" class="form-select" required>
                            <option value="all">All Users</option>
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }} ({{ u.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Title</label>
                        <input type="text" name="title" class="form-control" required maxlength="255">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Message</label>
                        <textarea name="body" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-karma w-100"><i class="bi bi-send me-1"></i> Send Notification</button>
                </form>
                <a href="{% url 'admin_panel' %}" class="btn btn-outline-secondary btn-sm mt-3">&larr; Back to Admin Panel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
