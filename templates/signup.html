{% extends 'base.html' %}
{% block title %}Sign Up - Hamro Karma{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="text-center mb-4">
            <h1 class="text-primary"><i class="bi bi-hand-index-thumb"></i> Hamro Karma</h1>
            <p class="text-muted">Create your account</p>
        </div>
        <div class="card shadow">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control"></div>
                        <div class="col"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-control"></div>
                    </div>
                    <div class="row mb-3">
                        <div class="col"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control"></div>
                        <div class="col"><label class="form-label">City</label><input type="text" name="city" class="form-control"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Account Type</label>
                        <select name="account_type" class="form-select">
                            <option value="CUSTOMER">Customer</option>
                            <option value="PROVIDER">Service Provider</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password1" class="form-control" required minlength="8">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                </form>
                <p class="text-center mt-3">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
