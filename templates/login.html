{% extends 'base.html' %}
{% block title %}Login - Hamro Karma{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h1 class="text-primary"><i class="bi bi-hand-index-thumb"></i> Hamro Karma</h1>
            <p class="text-muted">Sign in to continue</p>
        </div>
        <div class="card shadow">
            <div class="card-body p-4">
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>
                <p class="text-center mt-3">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
                <hr>
                <p class="text-center text-muted small">Demo Accounts</p>
                <div class="d-grid gap-2">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="username" value="rk1234">
                        <input type="hidden" name="password" value="rk1234">
                        <button class="btn btn-outline-success btn-sm">Customer (rk1234)</button>
                    </form>
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="username" value="ram1234">
                        <input type="hidden" name="password" value="ram1234">
                        <button class="btn btn-outline-warning btn-sm">Provider (ram1234)</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
